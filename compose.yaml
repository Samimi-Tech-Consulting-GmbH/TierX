

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - kb_vectors:/qdrant/storage
    mem_limit: 512m
    logging: *default-logging

  kb-semantic:
    build:
      context: .
      dockerfile: kb_semantic/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?MONGO_ROOT_USER is required}}}:${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}}}@mongodb:27017/
      TIERX_KB_SEMANTIC_INDEXING_ENABLED: ${TIERX_KB_SEMANTIC_INDEXING_ENABLED:-false}
      TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED: ${TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED:-false}
      OLLAMA_URL: ${TIERX_OLLAMA_URL:-${OLLAMA_URL:-${SOC_MIND_OLLAMA_URL:-http://ollama:11434}}}
      QDRANT_HOST: qdrant
      KB_SEMANTIC_MIN_SCORE: ${TIERX_KB_SEMANTIC_MIN_SCORE:-0.70}
    volumes:
      - kb_semantic_history:/data
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
  kafka:
    image: apache/kafka:3.7.0
    container_name: socmind_kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  mongodb:
    image: mongo:7.0.5
    container_name: socmind_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?Copy .env.example to .env and set MONGO_ROOT_USER}}}
      MONGO_INITDB_ROOT_PASSWORD: ${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?Copy .env.example to .env and set MONGO_ROOT_PASSWORD}}}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  ollama:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    container_name: socmind_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  init:
    build:
      context: ./init
      dockerfile: Dockerfile
    container_name: socmind_init
    environment:
      - OLLAMA_MODEL=${TIERX_OLLAMA_MODEL:-${OLLAMA_MODEL:-${SOC_MIND_OLLAMA_MODEL:-phi3:latest}}}
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # The init container exits after completion, so no restart.
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: socmind_backend
    restart: always
    environment:
      - MONGO_URL=mongodb://${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?MONGO_ROOT_USER is required}}}:${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}}}@mongodb:27017/
      - OLLAMA_URL=${TIERX_OLLAMA_URL:-${OLLAMA_URL:-${SOC_MIND_OLLAMA_URL:-http://ollama:11434}}}
      - KAFKA_BOOTSTRAP_SERVERS=${TIERX_KAFKA_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS:-${SOC_MIND_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}}}
      - PYTHON_ENV=${TIERX_PYTHON_ENV:-${PYTHON_ENV:-${SOC_MIND_PYTHON_ENV:-development}}}
      - JWT_SECRET_KEY=${TIERX_JWT_SECRET_KEY:-${JWT_SECRET_KEY:-${SOC_MIND_JWT_SECRET_KEY:?JWT_SECRET_KEY is required}}}
      - JWT_EXPIRATION_HOURS=${TIERX_JWT_EXPIRATION_HOURS:-${JWT_EXPIRATION_HOURS:-${SOC_MIND_JWT_EXPIRATION_HOURS:-24}}}
      - PLATFORM_ADMIN_EMAIL=${TIERX_PLATFORM_ADMIN_EMAIL:-${PLATFORM_ADMIN_EMAIL:-${SOC_MIND_PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}}}
      - PLATFORM_ADMIN_PASSWORD=${TIERX_PLATFORM_ADMIN_PASSWORD:-${PLATFORM_ADMIN_PASSWORD:-${SOC_MIND_PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}}}
      - CORS_ORIGINS=${TIERX_CORS_ORIGINS:-${CORS_ORIGINS:-${SOC_MIND_CORS_ORIGINS:-http://localhost:3000}}}
      - DEBUG_TRACE_ENABLED=${TIERX_DEBUG_TRACE_ENABLED:-${DEBUG_TRACE_ENABLED:-${SOC_MIND_DEBUG_TRACE_ENABLED:-false}}}
      - CORRELATION_ENABLED=${TIERX_CORRELATION_ENABLED:-${CORRELATION_ENABLED:-${SOC_MIND_CORRELATION_ENABLED:-false}}}
      - LLM_ANALYSIS_ENABLED=${TIERX_LLM_ANALYSIS_ENABLED:-${LLM_ANALYSIS_ENABLED:-${SOC_MIND_LLM_ANALYSIS_ENABLED:-false}}}
      - OLLAMA_MODEL=${TIERX_OLLAMA_MODEL:-${OLLAMA_MODEL:-${SOC_MIND_OLLAMA_MODEL:-phi3:latest}}}
      - OLLAMA_MODEL_DIGEST=${TIERX_OLLAMA_MODEL_DIGEST:-${OLLAMA_MODEL_DIGEST:-${SOC_MIND_OLLAMA_MODEL_DIGEST:-}}}
      - INGESTION_PROXY_URL=${TIERX_INGESTION_PROXY_URL:-${INGESTION_PROXY_URL:-${SOC_MIND_INGESTION_PROXY_URL:-http://ingestion-proxy:8000}}}
      - JIRA_ATTACHMENT_RETENTION_DAYS=${TIERX_JIRA_ATTACHMENT_RETENTION_DAYS:-${JIRA_ATTACHMENT_RETENTION_DAYS:-${SOC_MIND_JIRA_ATTACHMENT_RETENTION_DAYS:-7}}}
      - JIRA_QUARANTINE_CLEANUP_SECONDS=${TIERX_JIRA_QUARANTINE_CLEANUP_SECONDS:-${JIRA_QUARANTINE_CLEANUP_SECONDS:-${SOC_MIND_JIRA_QUARANTINE_CLEANUP_SECONDS:-3600}}}
      - JIRA_INGESTION_RETRY_SECONDS=${TIERX_JIRA_INGESTION_RETRY_SECONDS:-${JIRA_INGESTION_RETRY_SECONDS:-${SOC_MIND_JIRA_INGESTION_RETRY_SECONDS:-30}}}
      - APP_RELEASE_SHA=${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
      - APP_RELEASE_VERSION=${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
      - TIERX_UPDATE_CHECK_ENABLED=${TIERX_UPDATE_CHECK_ENABLED:-true}
      - PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED=${TIERX_PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-${PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-${SOC_MIND_PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-false}}}
      - WEBHOOK_SECRET_ENCRYPTION_KEY=${TIERX_WEBHOOK_SECRET_ENCRYPTION_KEY:-${WEBHOOK_SECRET_ENCRYPTION_KEY:-${SOC_MIND_WEBHOOK_SECRET_ENCRYPTION_KEY:-}}}
      - PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES=${TIERX_PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-${PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-262144}}}
      - PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES=${TIERX_PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-${PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-16384}}}
      - PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS=${TIERX_PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-${PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-${SOC_MIND_PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}}}
      - PLAYBOOK_WEBHOOK_MAX_COUNT=${TIERX_PLAYBOOK_WEBHOOK_MAX_COUNT:-${PLAYBOOK_WEBHOOK_MAX_COUNT:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_COUNT:-10}}}
      - ENRICHMENT_ACTIONS_ENABLED=${TIERX_ENRICHMENT_ACTIONS_ENABLED:-${ENRICHMENT_ACTIONS_ENABLED:-${SOC_MIND_ENRICHMENT_ACTIONS_ENABLED:-false}}}
      - KNOWLEDGE_BASE_PROCESSING_ENABLED=${TIERX_KNOWLEDGE_BASE_PROCESSING_ENABLED:-${KNOWLEDGE_BASE_PROCESSING_ENABLED:-${SOC_MIND_KNOWLEDGE_BASE_PROCESSING_ENABLED:-false}}}
      - KNOWLEDGE_BASE_RETRIEVAL_ENABLED=${TIERX_KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-${KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-${SOC_MIND_KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-false}}}
      - TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED=${TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  knowledge-base-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: socmind_kb_processor
    restart: always
    command: python kb_processor.py
    environment:
      - MONGO_URL=mongodb://${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?MONGO_ROOT_USER is required}}}:${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}}}@mongodb:27017/
      - KNOWLEDGE_BASE_PROCESSING_ENABLED=${TIERX_KNOWLEDGE_BASE_PROCESSING_ENABLED:-${KNOWLEDGE_BASE_PROCESSING_ENABLED:-${SOC_MIND_KNOWLEDGE_BASE_PROCESSING_ENABLED:-false}}}
      - KNOWLEDGE_BASE_PROCESSOR_INTERVAL_SECONDS=${TIERX_KNOWLEDGE_BASE_PROCESSOR_INTERVAL_SECONDS:-${KNOWLEDGE_BASE_PROCESSOR_INTERVAL_SECONDS:-${SOC_MIND_KNOWLEDGE_BASE_PROCESSOR_INTERVAL_SECONDS:-5}}}
      - KNOWLEDGE_BASE_PROCESSOR_LEASE_SECONDS=${TIERX_KNOWLEDGE_BASE_PROCESSOR_LEASE_SECONDS:-${KNOWLEDGE_BASE_PROCESSOR_LEASE_SECONDS:-${SOC_MIND_KNOWLEDGE_BASE_PROCESSOR_LEASE_SECONDS:-600}}}
    depends_on:
      mongodb:
        condition: service_healthy
    logging: *default-logging

  ingestion-proxy:
    build:
      context: .
      dockerfile: ingestion-proxy/Dockerfile
    container_name: socmind_ingestion_proxy
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${TIERX_KAFKA_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS:-${SOC_MIND_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}}}
      - KAFKA_RECEIVED_TOPIC=${TIERX_KAFKA_RECEIVED_TOPIC:-${KAFKA_RECEIVED_TOPIC:-${SOC_MIND_KAFKA_RECEIVED_TOPIC:-received}}}
      - KAFKA_DEAD_LETTER_TOPIC=${TIERX_KAFKA_DEAD_LETTER_TOPIC:-${KAFKA_DEAD_LETTER_TOPIC:-${SOC_MIND_KAFKA_DEAD_LETTER_TOPIC:-dead_letter_queue}}}
      - KAFKA_TRACE_TOPIC=${TIERX_KAFKA_TRACE_TOPIC:-${KAFKA_TRACE_TOPIC:-${SOC_MIND_KAFKA_TRACE_TOPIC:-alert_processing_events}}}
      - DEBUG_TRACE_ENABLED=${TIERX_DEBUG_TRACE_ENABLED:-${DEBUG_TRACE_ENABLED:-${SOC_MIND_DEBUG_TRACE_ENABLED:-false}}}
      - DEBUG_TRACE_MAX_SNAPSHOT_BYTES=${TIERX_DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-${DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-${SOC_MIND_DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-262144}}}
      - APP_RELEASE_SHA=${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
      - APP_RELEASE_VERSION=${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
      - MONGO_URL=mongodb://${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?MONGO_ROOT_USER is required}}}:${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}}}@mongodb:27017/
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: socmind_pipeline
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${TIERX_KAFKA_BOOTSTRAP_SERVERS:-${KAFKA_BOOTSTRAP_SERVERS:-${SOC_MIND_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}}}
      - MONGO_URL=mongodb://${TIERX_MONGO_ROOT_USER:-${MONGO_ROOT_USER:-${SOC_MIND_MONGO_ROOT_USER:?MONGO_ROOT_USER is required}}}:${TIERX_MONGO_ROOT_PASSWORD:-${MONGO_ROOT_PASSWORD:-${SOC_MIND_MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}}}@mongodb:27017/
      - OLLAMA_URL=${TIERX_OLLAMA_URL:-${OLLAMA_URL:-${SOC_MIND_OLLAMA_URL:-http://ollama:11434}}}
      - KAFKA_RECEIVED_TOPIC=${TIERX_KAFKA_RECEIVED_TOPIC:-${KAFKA_RECEIVED_TOPIC:-${SOC_MIND_KAFKA_RECEIVED_TOPIC:-received}}}
      - KAFKA_VALIDATED_TOPIC=${TIERX_KAFKA_VALIDATED_TOPIC:-${KAFKA_VALIDATED_TOPIC:-${SOC_MIND_KAFKA_VALIDATED_TOPIC:-validated}}}
      - KAFKA_NORMALIZED_TOPIC=${TIERX_KAFKA_NORMALIZED_TOPIC:-${KAFKA_NORMALIZED_TOPIC:-${SOC_MIND_KAFKA_NORMALIZED_TOPIC:-normalized}}}
      - KAFKA_ENRICHED_TOPIC=${TIERX_KAFKA_ENRICHED_TOPIC:-${KAFKA_ENRICHED_TOPIC:-${SOC_MIND_KAFKA_ENRICHED_TOPIC:-enriched}}}
      - KAFKA_CLUSTERED_TOPIC=${TIERX_KAFKA_CLUSTERED_TOPIC:-${KAFKA_CLUSTERED_TOPIC:-${SOC_MIND_KAFKA_CLUSTERED_TOPIC:-clustered}}}
      - KAFKA_DISTINCT_TOPIC=${TIERX_KAFKA_DISTINCT_TOPIC:-${KAFKA_DISTINCT_TOPIC:-${SOC_MIND_KAFKA_DISTINCT_TOPIC:-distinct}}}
      - KAFKA_DEAD_LETTER_TOPIC=${TIERX_KAFKA_DEAD_LETTER_TOPIC:-${KAFKA_DEAD_LETTER_TOPIC:-${SOC_MIND_KAFKA_DEAD_LETTER_TOPIC:-dead_letter_queue}}}
      - KAFKA_TRACE_TOPIC=${TIERX_KAFKA_TRACE_TOPIC:-${KAFKA_TRACE_TOPIC:-${SOC_MIND_KAFKA_TRACE_TOPIC:-alert_processing_events}}}
      - DEBUG_TRACE_ENABLED=${TIERX_DEBUG_TRACE_ENABLED:-${DEBUG_TRACE_ENABLED:-${SOC_MIND_DEBUG_TRACE_ENABLED:-false}}}
      - DEBUG_TRACE_RETENTION_DAYS=${TIERX_DEBUG_TRACE_RETENTION_DAYS:-${DEBUG_TRACE_RETENTION_DAYS:-${SOC_MIND_DEBUG_TRACE_RETENTION_DAYS:-7}}}
      - DEBUG_TRACE_MAX_SNAPSHOT_BYTES=${TIERX_DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-${DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-${SOC_MIND_DEBUG_TRACE_MAX_SNAPSHOT_BYTES:-262144}}}
      - CORRELATION_ENABLED=${TIERX_CORRELATION_ENABLED:-${CORRELATION_ENABLED:-${SOC_MIND_CORRELATION_ENABLED:-false}}}
      - LLM_ANALYSIS_ENABLED=${TIERX_LLM_ANALYSIS_ENABLED:-${LLM_ANALYSIS_ENABLED:-${SOC_MIND_LLM_ANALYSIS_ENABLED:-false}}}
      - OLLAMA_MODEL=${TIERX_OLLAMA_MODEL:-${OLLAMA_MODEL:-${SOC_MIND_OLLAMA_MODEL:-phi3:latest}}}
      - OLLAMA_MODEL_DIGEST=${TIERX_OLLAMA_MODEL_DIGEST:-${OLLAMA_MODEL_DIGEST:-${SOC_MIND_OLLAMA_MODEL_DIGEST:-}}}
      - LLM_TIMEOUT_SECONDS=${TIERX_LLM_TIMEOUT_SECONDS:-${LLM_TIMEOUT_SECONDS:-${SOC_MIND_LLM_TIMEOUT_SECONDS:-120}}}
      - LLM_MAX_TOKENS=${TIERX_LLM_MAX_TOKENS:-${LLM_MAX_TOKENS:-${SOC_MIND_LLM_MAX_TOKENS:-2048}}}
      - LLM_CONTEXT_MAX_BYTES=${TIERX_LLM_CONTEXT_MAX_BYTES:-${LLM_CONTEXT_MAX_BYTES:-${SOC_MIND_LLM_CONTEXT_MAX_BYTES:-65536}}}
      - LLM_SCHEDULER_INTERVAL_SECONDS=${TIERX_LLM_SCHEDULER_INTERVAL_SECONDS:-${LLM_SCHEDULER_INTERVAL_SECONDS:-${SOC_MIND_LLM_SCHEDULER_INTERVAL_SECONDS:-5}}}
      - LLM_JOB_LEASE_SECONDS=${TIERX_LLM_JOB_LEASE_SECONDS:-${LLM_JOB_LEASE_SECONDS:-${SOC_MIND_LLM_JOB_LEASE_SECONDS:-1200}}}
      - LLM_RETRY_BACKOFF_SECONDS=${TIERX_LLM_RETRY_BACKOFF_SECONDS:-${LLM_RETRY_BACKOFF_SECONDS:-${SOC_MIND_LLM_RETRY_BACKOFF_SECONDS:-5,10,20}}}
      - APP_RELEASE_SHA=${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
      - APP_RELEASE_VERSION=${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
      - PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED=${TIERX_PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-${PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-${SOC_MIND_PLAYBOOK_CONTEXT_WEBHOOKS_ENABLED:-false}}}
      - WEBHOOK_SECRET_ENCRYPTION_KEY=${TIERX_WEBHOOK_SECRET_ENCRYPTION_KEY:-${WEBHOOK_SECRET_ENCRYPTION_KEY:-${SOC_MIND_WEBHOOK_SECRET_ENCRYPTION_KEY:-}}}
      - PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES=${TIERX_PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-${PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_REQUEST_BYTES:-262144}}}
      - PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES=${TIERX_PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-${PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_RESPONSE_BYTES:-16384}}}
      - PLAYBOOK_WEBHOOK_MAX_TOTAL_PROMPT_BYTES=${TIERX_PLAYBOOK_WEBHOOK_MAX_TOTAL_PROMPT_BYTES:-${PLAYBOOK_WEBHOOK_MAX_TOTAL_PROMPT_BYTES:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_TOTAL_PROMPT_BYTES:-65536}}}
      - PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS=${TIERX_PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-${PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-${SOC_MIND_PLAYBOOK_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}}}
      - PLAYBOOK_WEBHOOK_MAX_COUNT=${TIERX_PLAYBOOK_WEBHOOK_MAX_COUNT:-${PLAYBOOK_WEBHOOK_MAX_COUNT:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_COUNT:-10}}}
      - PLAYBOOK_WEBHOOK_MAX_CONCURRENCY=${TIERX_PLAYBOOK_WEBHOOK_MAX_CONCURRENCY:-${PLAYBOOK_WEBHOOK_MAX_CONCURRENCY:-${SOC_MIND_PLAYBOOK_WEBHOOK_MAX_CONCURRENCY:-5}}}
      - ENRICHMENT_ACTIONS_ENABLED=${TIERX_ENRICHMENT_ACTIONS_ENABLED:-${ENRICHMENT_ACTIONS_ENABLED:-${SOC_MIND_ENRICHMENT_ACTIONS_ENABLED:-false}}}
      - ENRICHMENT_ACTION_MAX_COUNT=${TIERX_ENRICHMENT_ACTION_MAX_COUNT:-${ENRICHMENT_ACTION_MAX_COUNT:-${SOC_MIND_ENRICHMENT_ACTION_MAX_COUNT:-10}}}
      - ENRICHMENT_ACTION_MAX_CONCURRENCY=${TIERX_ENRICHMENT_ACTION_MAX_CONCURRENCY:-${ENRICHMENT_ACTION_MAX_CONCURRENCY:-${SOC_MIND_ENRICHMENT_ACTION_MAX_CONCURRENCY:-5}}}
      - ENRICHMENT_ACTION_SCHEDULER_INTERVAL_SECONDS=${TIERX_ENRICHMENT_ACTION_SCHEDULER_INTERVAL_SECONDS:-${ENRICHMENT_ACTION_SCHEDULER_INTERVAL_SECONDS:-${SOC_MIND_ENRICHMENT_ACTION_SCHEDULER_INTERVAL_SECONDS:-2}}}
      - ENRICHMENT_ACTION_MAX_REQUEST_BYTES=${TIERX_ENRICHMENT_ACTION_MAX_REQUEST_BYTES:-${ENRICHMENT_ACTION_MAX_REQUEST_BYTES:-${SOC_MIND_ENRICHMENT_ACTION_MAX_REQUEST_BYTES:-262144}}}
      - ENRICHMENT_ACTION_MAX_RESPONSE_BYTES=${TIERX_ENRICHMENT_ACTION_MAX_RESPONSE_BYTES:-${ENRICHMENT_ACTION_MAX_RESPONSE_BYTES:-${SOC_MIND_ENRICHMENT_ACTION_MAX_RESPONSE_BYTES:-32768}}}
      - ENRICHMENT_ACTION_MAX_CONTEXT_BYTES=${TIERX_ENRICHMENT_ACTION_MAX_CONTEXT_BYTES:-${ENRICHMENT_ACTION_MAX_CONTEXT_BYTES:-${SOC_MIND_ENRICHMENT_ACTION_MAX_CONTEXT_BYTES:-16384}}}
      - KNOWLEDGE_BASE_RETRIEVAL_ENABLED=${TIERX_KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-${KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-${SOC_MIND_KNOWLEDGE_BASE_RETRIEVAL_ENABLED:-false}}}
      - KNOWLEDGE_BASE_MAX_CANDIDATES=${TIERX_KNOWLEDGE_BASE_MAX_CANDIDATES:-${KNOWLEDGE_BASE_MAX_CANDIDATES:-${SOC_MIND_KNOWLEDGE_BASE_MAX_CANDIDATES:-500}}}
      - TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED=${TIERX_KB_SEMANTIC_RETRIEVAL_ENABLED:-false}
      - KNOWLEDGE_BASE_PROMPT_MAX_BYTES=${TIERX_KNOWLEDGE_BASE_PROMPT_MAX_BYTES:-${KNOWLEDGE_BASE_PROMPT_MAX_BYTES:-${SOC_MIND_KNOWLEDGE_BASE_PROMPT_MAX_BYTES:-32768}}}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TIERX_API_URL: ${NEXT_PUBLIC_TIERX_API_URL-${NEXT_PUBLIC_API_URL-http://localhost:8000}}
        NEXT_PUBLIC_TIERX_RELEASE_SHA: ${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
        NEXT_PUBLIC_TIERX_RELEASE_VERSION: ${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
        NEXT_PUBLIC_TIERX_SOURCE_REPOSITORY: ${TIERX_SOURCE_REPOSITORY:-}
    container_name: socmind_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL-http://localhost:8000}
      - NEXT_PUBLIC_APP_RELEASE_SHA=${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
      - NEXT_PUBLIC_APP_RELEASE_VERSION=${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
      - NEXT_PUBLIC_TIERX_API_URL=${NEXT_PUBLIC_TIERX_API_URL-${NEXT_PUBLIC_API_URL-http://localhost:8000}}
      - NEXT_PUBLIC_TIERX_RELEASE_SHA=${TIERX_APP_RELEASE_SHA:-${APP_RELEASE_SHA:-${SOC_MIND_APP_RELEASE_SHA:-development}}}
      - NEXT_PUBLIC_TIERX_RELEASE_VERSION=${TIERX_APP_RELEASE_VERSION:-${APP_RELEASE_VERSION:-${SOC_MIND_APP_RELEASE_VERSION:-development}}}
      - NEXT_PUBLIC_TIERX_SOURCE_REPOSITORY=${TIERX_SOURCE_REPOSITORY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

